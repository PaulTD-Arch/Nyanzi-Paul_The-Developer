<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Budget</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#21253a;--border:#2d3150;
  --accent:#6c63ff;--accent2:#ff6584;--green:#43d97b;--orange:#ffb347;
  --red:#ff5f6d;--yellow:#ffd166;--text:#e8eaf0;--muted:#7b82a0;
  --r:14px;--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow-x:hidden;}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* TOP BAR */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;gap:8px;flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:9px;}
.app-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.app-title{font-size:15px;font-weight:700;}
.topbar-right{display:flex;gap:7px;align-items:center;}
.month-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 10px;display:flex;align-items:center;gap:5px;}
.month-pill select{background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:11.5px;font-weight:600;outline:none;cursor:pointer;max-width:110px;}
.month-pill select option{background:var(--surface);}
.save-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.save-btn:active{opacity:0.8;}

/* SCROLL CONTENT */
.content{flex:1;overflow-y:auto;padding:12px 12px 86px;-webkit-overflow-scrolling:touch;}

/* HERO STRIP */
.hero-strip{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 13px 11px;position:relative;overflow:hidden;}
.hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.c-total::before{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.c-spent::before{background:linear-gradient(90deg,var(--orange),var(--red));}
.c-remaining::before{background:linear-gradient(90deg,var(--green),#22c55e);}
.c-savings::before{background:linear-gradient(90deg,var(--yellow),var(--orange));}
.hlabel{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono);margin-bottom:5px;}
.hval{font-size:17px;font-weight:700;font-family:var(--mono);letter-spacing:-0.5px;line-height:1.1;word-break:break-all;}
.c-total .hval{color:var(--accent);} .c-spent .hval{color:var(--orange);} .c-remaining .hval{color:var(--green);} .c-savings .hval{color:var(--yellow);}
.hsub{font-size:9.5px;color:var(--muted);margin-top:3px;}

/* PROGRESS */
.prog-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:12px;}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.prog-row h3{font-size:12.5px;font-weight:600;}
.prog-pct{font-family:var(--mono);font-size:11.5px;color:var(--muted);}
.prog-bar-bg{background:var(--surface2);border-radius:99px;height:8px;overflow:hidden;margin-bottom:9px;}
.prog-bar-fill{height:100%;border-radius:99px;transition:width 0.4s ease;}
.prog-legend{display:flex;gap:10px;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* PAGE */
.page{display:none;} .page.active{display:block;}

/* INCOME PAGE */
.income-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:11px;}
.section-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono);margin-bottom:13px;font-weight:600;}
.field-row{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
.field-row:last-of-type{margin-bottom:0;}
.field-row label{font-size:12px;color:var(--muted);}
.field-input{background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--mono);font-size:16px;font-weight:600;padding:12px 14px;outline:none;width:100%;transition:border-color 0.15s;-webkit-appearance:none;}
.field-input:focus{border-color:var(--accent);}
.field-input.green{color:var(--green);} .field-input.yellow{color:var(--yellow);}
.total-row{background:linear-gradient(135deg,rgba(108,99,255,0.12),rgba(255,101,132,0.08));border:1px solid rgba(108,99,255,0.3);border-radius:10px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.total-row .tl{font-size:12px;color:var(--muted);}
.total-row .tv{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent);}
.goal-prog-bg{background:var(--surface2);border-radius:99px;height:7px;overflow:hidden;margin:10px 0 6px;}
.goal-prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width 0.4s;}
.goal-status{font-size:12px;text-align:center;padding:4px 0;}

/* CATEGORIES */
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:11px;overflow:hidden;}
.cat-header-btn{width:100%;background:transparent;border:none;color:var(--text);padding:13px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left;font-family:var(--font);-webkit-tap-highlight-color:transparent;}
.ch-left{display:flex;align-items:center;gap:9px;}
.ch-icon{font-size:19px;}
.ch-name{font-size:13.5px;font-weight:600;}
.ch-right{display:flex;align-items:center;gap:7px;}
.cat-subtotal-badge{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--surface2);}
.cat-chevron{font-size:10px;color:var(--muted);transition:transform 0.2s;}
.cat-chevron.open{transform:rotate(180deg);}
.cat-body{display:none;border-top:1px solid var(--border);}
.cat-body.open{display:block;}

/* ITEM CARDS */
.item-card{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(45,49,80,0.6);}
.item-card:last-of-type{border-bottom:none;}
.item-left{flex:1;min-width:0;}
.item-name-in{background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:13.5px;outline:none;width:100%;padding:0;font-weight:500;}
.item-name-in::placeholder{color:var(--muted);}
.item-nums{display:flex;gap:8px;align-items:flex-end;margin-top:8px;flex-wrap:wrap;}
.num-block{display:flex;flex-direction:column;gap:3px;}
.num-lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-family:var(--mono);}
.num-in{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:14px;font-weight:600;padding:7px 9px;outline:none;width:90px;text-align:right;-webkit-appearance:none;transition:border-color 0.15s;}
.num-in:focus{border-color:var(--accent);}
.num-in.sm{width:65px;}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.del-btn{background:transparent;border:none;color:var(--border);font-size:22px;cursor:pointer;padding:0 2px;line-height:1;transition:color 0.15s;}
.del-btn:active{color:var(--red);}
.item-total{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;}
.empty-state{padding:18px;text-align:center;color:var(--muted);font-size:12.5px;}

/* ADD FORM */
.add-form{padding:12px 14px;background:rgba(108,99,255,0.05);border-top:1px dashed var(--border);}
.add-form-title{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;font-family:var(--mono);margin-bottom:9px;}
.add-fields{display:flex;flex-direction:column;gap:7px;}
.add-row{display:flex;gap:7px;}
.add-in{flex:1;background:var(--surface2);border:1.5px dashed var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;padding:10px 12px;outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
.add-in:focus{border-color:var(--accent);border-style:solid;}
.add-in::placeholder{color:var(--muted);}
.add-in.mono{font-family:var(--mono);}
.add-in.sm{flex:0 0 80px;text-align:right;}
.add-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:12px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;margin-top:3px;}
.add-btn:active{opacity:0.8;}

/* CHARTS */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:11px;}
.chart-card h3{font-size:13px;font-weight:600;margin-bottom:13px;}
.donut-wrap{position:relative;height:210px;margin-bottom:12px;}
.bd-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid rgba(45,49,80,0.5);}
.bd-row:last-child{border-bottom:none;}
.bd-name{font-size:11.5px;color:var(--muted);min-width:80px;}
.bd-bar-bg{flex:1;background:var(--surface2);border-radius:99px;height:5px;overflow:hidden;}
.bd-bar{height:100%;border-radius:99px;transition:width 0.4s;}
.bd-amt{font-family:var(--mono);font-size:12px;font-weight:600;min-width:50px;text-align:right;}

/* HISTORY */
.history-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:11px;}
.history-card h3{font-size:13px;font-weight:600;margin-bottom:13px;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(45,49,80,0.5);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.hist-row:last-child{border-bottom:none;}
.hist-row:active{opacity:0.6;}
.hist-month{font-size:13.5px;font-weight:500;}
.hist-meta{text-align:right;}
.hist-spent{font-family:var(--mono);font-size:12.5px;font-weight:700;}
.hist-bal{font-size:11px;margin-top:2px;}
.notes-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:11px;}
.notes-card h3{font-size:13px;font-weight:600;margin-bottom:11px;}
.notes-ta{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--font);font-size:13px;padding:11px 12px;resize:vertical;min-height:90px;outline:none;line-height:1.6;transition:border-color 0.15s;}
.notes-ta:focus{border-color:var(--accent);}
.notes-ta::placeholder{color:var(--muted);}
.export-btn{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:13px;font-weight:600;padding:13px;cursor:pointer;margin-bottom:11px;}
.export-btn:active{opacity:0.7;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 8px;cursor:pointer;background:transparent;border:none;color:var(--muted);font-family:var(--font);font-size:9.5px;font-weight:500;gap:3px;transition:color 0.15s;-webkit-tap-highlight-color:transparent;}
.nav-tab.active{color:var(--accent);}
.nav-icon{font-size:21px;line-height:1;}

/* TOAST */
#toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:10px 20px;border-radius:20px;opacity:0;transition:all 0.25s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="app-icon">💰</div>
    <span class="app-title">Budget</span>
  </div>
  <div class="topbar-right">
    <div class="month-pill">📅 <select id="month-select" onchange="switchMonth(this.value)"></select></div>
    <button class="save-btn" onclick="saveData()">Save ✓</button>
  </div>
</div>

<div class="content" id="main-content">

  <!-- HERO ALWAYS VISIBLE -->
  <div class="hero-strip">
    <div class="hero-card c-total"><div class="hlabel">Budget</div><div class="hval" id="h-total">0</div><div class="hsub">Available</div></div>
    <div class="hero-card c-spent"><div class="hlabel">Spent</div><div class="hval" id="h-spent">0</div><div class="hsub" id="h-spent-pct">0% used</div></div>
    <div class="hero-card c-remaining"><div class="hlabel">Remaining</div><div class="hval" id="h-remaining">0</div><div class="hsub">Left over</div></div>
    <div class="hero-card c-savings"><div class="hlabel">Saved</div><div class="hval" id="h-savings">0%</div><div class="hsub">Of income</div></div>
  </div>

  <div class="prog-card">
    <div class="prog-row"><h3>Budget Usage</h3><span class="prog-pct" id="prog-pct">0%</span></div>
    <div class="prog-bar-bg"><div class="prog-bar-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--accent)"></div>Utilities</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>Food</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--orange)"></div>Ingredients</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--accent2)"></div>Additionals</div>
    </div>
  </div>

  <!-- PAGE: EXPENSES -->
  <div class="page active" id="page-categories">
    <div id="categories-container"></div>
  </div>

  <!-- PAGE: INCOME -->
  <div class="page" id="page-income">
    <div class="income-card">
      <div class="section-label">Income</div>
      <div class="field-row"><label>Monthly Income (UGX)</label><input type="number" class="field-input green" id="income-input" value="170000" inputmode="numeric" oninput="recalculate()"></div>
      <div class="field-row"><label>Other Income (UGX)</label><input type="number" class="field-input green" id="other-income" value="0" inputmode="numeric" oninput="recalculate()"></div>
      <div class="total-row"><span class="tl">Total Available</span><span class="tv" id="total-income-disp">UGX 170,000</span></div>
    </div>
    <div class="income-card">
      <div class="section-label">Savings Goal</div>
      <div class="field-row"><label>Target savings (UGX)</label><input type="number" class="field-input yellow" id="goal-input" value="30000" inputmode="numeric" oninput="recalculate()"></div>
      <div class="goal-prog-bg"><div class="goal-prog-fill" id="goal-fill" style="width:0%"></div></div>
      <div class="goal-status" id="goal-status">—</div>
    </div>
  </div>

  <!-- PAGE: CHARTS -->
  <div class="page" id="page-charts">
    <div class="chart-card">
      <h3>📊 Spending Breakdown</h3>
      <div class="donut-wrap"><canvas id="donut-chart"></canvas></div>
      <div id="breakdown-list"></div>
    </div>
  </div>

  <!-- PAGE: MORE -->
  <div class="page" id="page-history">
    <div class="history-card">
      <h3>🗓 Monthly History</h3>
      <div id="history-list"><p class="empty-state">Save months to build history.</p></div>
    </div>
    <div class="notes-card">
      <h3>📝 Notes</h3>
      <textarea class="notes-ta" id="notes-area" placeholder="Reminders, shopping notes…"></textarea>
    </div>
    <button class="export-btn" onclick="exportCSV()">↓ Export this month as CSV</button>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-tab active" id="nav-categories" onclick="switchPage('categories')"><span class="nav-icon">🛒</span>Expenses</button>
  <button class="nav-tab" id="nav-income" onclick="switchPage('income')"><span class="nav-icon">💵</span>Income</button>
  <button class="nav-tab" id="nav-charts" onclick="switchPage('charts')"><span class="nav-icon">📊</span>Charts</button>
  <button class="nav-tab" id="nav-history" onclick="switchPage('history')"><span class="nav-icon">🗓</span>More</button>
</nav>

<div id="toast">Saved ✓</div>

<script>
const STORAGE_KEY='hh_budget_v4';
const CATEGORY_DEFS=[
  {id:'utilities',label:'Utilities & Upkeep',icon:'🏠',color:'#6c63ff',hasQty:false,
   defaultItems:[{name:"Yaka",qty:1,cost:0},{name:"Water",qty:1,cost:0},{name:"Charcoal",qty:1,cost:0},{name:"Mum's Upkeep",qty:1,cost:60000},{name:"Gas",qty:1,cost:0}]},
  {id:'food',label:'Food & Groceries',icon:'🛒',color:'#43d97b',hasQty:true,
   defaultItems:[{name:"Peas",qty:2,cost:6000},{name:"Beans",qty:1,cost:5500},{name:"Sugar",qty:0,cost:4000},{name:"G.nuts",qty:2,cost:7000},{name:"Sunseed",qty:1,cost:30000},{name:"Rice",qty:2,cost:5000},{name:"Bushera",qty:1,cost:4000},{name:"Popcorn",qty:1,cost:5000}]},
  {id:'ingredients',label:'Ingredients & Spices',icon:'🧄',color:'#ffb347',hasQty:false,
   defaultItems:[{name:"Onions",qty:1,cost:0},{name:"Tomatoes",qty:1,cost:0},{name:"Garlic",qty:1,cost:0},{name:"Carrots",qty:1,cost:0},{name:"Green Pepper",qty:1,cost:0},{name:"Ginger",qty:1,cost:0},{name:"Lemons",qty:1,cost:0},{name:"Oranges",qty:1,cost:0},{name:"Mudalasini",qty:1,cost:0},{name:"Turkey",qty:1,cost:0},{name:"Royco",qty:1,cost:0},{name:"Lighting Sticks",qty:1,cost:0}]},
  {id:'additionals',label:'Additionals & Hygiene',icon:'🧴',color:'#ff6584',hasQty:false,
   defaultItems:[{name:"Soap",qty:1,cost:6000},{name:"Toilet Paper",qty:1,cost:5000},{name:"Toothpaste",qty:1,cost:6000}]}
];

let state={},currentMonth=monthKey(new Date()),donutChart=null,activePage='categories';

function monthKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function fmt(n){return'UGX '+Math.round(n).toLocaleString('en-UG');}
function fmtS(n){if(n>=1000000)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(0)+'K';return Math.round(n)+''}
function monthLabel(k){const[y,m]=k.split('-');return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function loadState(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)state=JSON.parse(r);}catch(e){state={};}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}

function getMonthData(key){
  if(!state[key]){state[key]={income:170000,otherIncome:0,savingsGoal:30000,notes:'',
    categories:CATEGORY_DEFS.map(c=>({id:c.id,items:c.defaultItems.map(i=>({...i}))}));};}
  return state[key];
}
function getItems(catId){return getMonthData(currentMonth).categories.find(c=>c.id===catId)?.items||[];}

// NAV
function switchPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.getElementById('nav-'+page).classList.add('active');
  activePage=page;
  if(page==='charts')renderCharts();
  document.getElementById('main-content').scrollTop=0;
}

function switchMonth(key){captureState();currentMonth=key;renderAll();}

function buildMonthOptions(){
  const sel=document.getElementById('month-select');
  sel.innerHTML='';
  const now=new Date();
  for(let i=-3;i<=3;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    const key=monthKey(d);
    const opt=document.createElement('option');
    opt.value=key;
    opt.textContent=d.toLocaleDateString('en-US',{month:'short',year:'numeric'});
    if(key===currentMonth)opt.selected=true;
    sel.appendChild(opt);
  }
}

// CATEGORIES
function renderCategories(){
  const d=getMonthData(currentMonth);
  const container=document.getElementById('categories-container');
  container.innerHTML='';
  CATEGORY_DEFS.forEach(cat=>{
    const catData=d.categories.find(c=>c.id===cat.id)||{items:cat.defaultItems};
    const sub=catData.items.reduce((s,it)=>s+it.qty*it.cost,0);
    const card=document.createElement('div');
    card.className='cat-card';
    card.innerHTML=`
      <button class="cat-header-btn" onclick="toggleCat('${cat.id}')">
        <div class="ch-left"><span class="ch-icon">${cat.icon}</span><span class="ch-name">${cat.label}</span></div>
        <div class="ch-right">
          <span class="cat-subtotal-badge" id="cat-sub-${cat.id}" style="color:${cat.color}">${fmt(sub)}</span>
          <span class="cat-chevron open" id="chev-${cat.id}">▼</span>
        </div>
      </button>
      <div class="cat-body open" id="cat-body-${cat.id}">
        <div id="items-${cat.id}"></div>
        <div class="add-form">
          <div class="add-form-title">Add Item</div>
          <div class="add-fields">
            <input class="add-in" type="text" id="new-name-${cat.id}" placeholder="Item name (e.g. Milk)">
            <div class="add-row">
              ${cat.hasQty?`<input class="add-in mono sm" type="number" id="new-qty-${cat.id}" placeholder="Qty" inputmode="numeric">`:''}
              <input class="add-in mono" type="number" id="new-cost-${cat.id}" placeholder="Cost (UGX)" inputmode="numeric">
            </div>
            <button class="add-btn" onclick="addItem('${cat.id}')">+ Add Item</button>
          </div>
        </div>
      </div>`;
    container.appendChild(card);
    renderItems(cat.id,catData.items);
    [`new-name-${cat.id}`,`new-qty-${cat.id}`,`new-cost-${cat.id}`].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter')addItem(cat.id);});
    });
  });
}

function renderItems(catId,items){
  const cat=CATEGORY_DEFS.find(c=>c.id===catId);
  const container=document.getElementById(`items-${catId}`);
  container.innerHTML='';
  if(!items.length){container.innerHTML='<div class="empty-state">No items yet. Add one below.</div>';return;}
  items.forEach((item,i)=>{
    const total=item.qty*item.cost;
    const div=document.createElement('div');
    div.className='item-card';
    div.innerHTML=`
      <div class="item-left">
        <input type="text" class="item-name-in" value="${esc(item.name)}" placeholder="Item name" oninput="updateItem('${catId}',${i},'name',this.value)">
        <div class="item-nums">
          ${cat.hasQty?`<div class="num-block"><span class="num-lbl">Qty</span><input type="number" class="num-in sm" value="${item.qty}" inputmode="numeric" oninput="updateItem('${catId}',${i},'qty',this.value)"></div>`:''}
          <div class="num-block" style="flex:1"><span class="num-lbl">Cost (UGX)</span><input type="number" class="num-in" style="width:100%" value="${item.cost}" inputmode="numeric" oninput="updateItem('${catId}',${i},'cost',this.value)"></div>
        </div>
      </div>
      <div class="item-right">
        <button class="del-btn" onclick="deleteItem('${catId}',${i})">×</button>
        <span class="item-total" id="itot-${catId}-${i}">${fmtS(total)}</span>
      </div>`;
    container.appendChild(div);
  });
}

function toggleCat(catId){
  const body=document.getElementById(`cat-body-${catId}`);
  const chev=document.getElementById(`chev-${catId}`);
  const open=body.classList.toggle('open');
  chev.classList.toggle('open',open);
}

function updateItem(catId,idx,field,val){
  const items=getItems(catId);
  if(!items[idx])return;
  if(field==='name')items[idx].name=val;
  else if(field==='qty')items[idx].qty=parseFloat(val)||0;
  else if(field==='cost')items[idx].cost=parseFloat(val)||0;
  const total=items[idx].qty*items[idx].cost;
  const el=document.getElementById(`itot-${catId}-${idx}`);
  if(el)el.textContent=fmtS(total);
  updateCatSub(catId);recalculate();
}

function deleteItem(catId,idx){getItems(catId).splice(idx,1);renderItems(catId,getItems(catId));updateCatSub(catId);recalculate();}

function addItem(catId){
  const cat=CATEGORY_DEFS.find(c=>c.id===catId);
  const nameEl=document.getElementById(`new-name-${catId}`);
  const costEl=document.getElementById(`new-cost-${catId}`);
  const qtyEl=document.getElementById(`new-qty-${catId}`);
  const name=nameEl?.value.trim();
  if(!name){nameEl?.focus();return;}
  const cost=parseFloat(costEl?.value)||0;
  const qty=cat.hasQty?(parseFloat(qtyEl?.value)||1):1;
  getItems(catId).push({name,qty,cost});
  renderItems(catId,getItems(catId));updateCatSub(catId);recalculate();
  nameEl.value='';if(costEl)costEl.value='';if(qtyEl)qtyEl.value='';
  nameEl.focus();
}

function updateCatSub(catId){
  const sub=getItems(catId).reduce((s,it)=>s+it.qty*it.cost,0);
  const el=document.getElementById(`cat-sub-${catId}`);
  if(el)el.textContent=fmt(sub);
}

// RECALCULATE
function recalculate(){
  const income=parseFloat(document.getElementById('income-input')?.value)||0;
  const other=parseFloat(document.getElementById('other-income')?.value)||0;
  const total=income+other;
  const goal=parseFloat(document.getElementById('goal-input')?.value)||0;
  document.getElementById('total-income-disp').textContent=fmt(total);
  const catTotals={};let spent=0;
  CATEGORY_DEFS.forEach(cat=>{const s=getItems(cat.id).reduce((a,it)=>a+it.qty*it.cost,0);catTotals[cat.id]=s;spent+=s;});
  const remaining=total-spent;
  const usedPct=total>0?Math.min(100,spent/total*100):0;
  const savePct=total>0?(remaining/total*100):0;
  document.getElementById('h-total').textContent=fmtS(total);
  document.getElementById('h-spent').textContent=fmtS(spent);
  document.getElementById('h-spent-pct').textContent=usedPct.toFixed(0)+'% used';
  document.getElementById('h-remaining').textContent=fmtS(remaining);
  document.getElementById('h-savings').textContent=Math.max(0,savePct).toFixed(0)+'%';
  const fill=document.getElementById('prog-fill');
  fill.style.width=usedPct+'%';
  fill.style.background=usedPct>90?'linear-gradient(90deg,var(--orange),var(--red))':usedPct>70?'linear-gradient(90deg,var(--yellow),var(--orange))':'linear-gradient(90deg,var(--accent),var(--green))';
  document.getElementById('prog-pct').textContent=usedPct.toFixed(0)+'% used';
  const gPct=goal>0?Math.min(100,remaining/goal*100):0;
  document.getElementById('goal-fill').style.width=Math.max(0,gPct)+'%';
  document.getElementById('goal-status').innerHTML=remaining>=goal?`<span style="color:var(--green)">✓ Goal reached! ${fmt(remaining-goal)} over</span>`:remaining>0?`<span style="color:var(--orange)">${fmt(goal-remaining)} more needed (${gPct.toFixed(0)}%)</span>`:`<span style="color:var(--red)">Over budget — goal not met</span>`;
  window._catTotals=catTotals;window._spent=spent;
  if(activePage==='charts')renderCharts();
}

// CHARTS
function renderCharts(){
  const catTotals=window._catTotals||{};
  let spent=window._spent||0;
  if(!Object.keys(catTotals).length){CATEGORY_DEFS.forEach(cat=>{catTotals[cat.id]=getItems(cat.id).reduce((s,it)=>s+it.qty*it.cost,0);spent+=catTotals[cat.id];});}
  const data=CATEGORY_DEFS.map(c=>catTotals[c.id]||0);
  if(donutChart){donutChart.data.datasets[0].data=data;donutChart.update('active');}
  else{
    const ctx=document.getElementById('donut-chart').getContext('2d');
    donutChart=new Chart(ctx,{type:'doughnut',
      data:{labels:CATEGORY_DEFS.map(c=>c.label),datasets:[{data,backgroundColor:CATEGORY_DEFS.map(c=>c.color),borderColor:'#1a1d27',borderWidth:3,hoverOffset:6}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>` ${fmt(c.parsed)} (${spent>0?(c.parsed/spent*100).toFixed(1):0}%)`},
          backgroundColor:'#21253a',borderColor:'#2d3150',borderWidth:1,titleColor:'#e8eaf0',bodyColor:'#7b82a0',padding:12,cornerRadius:8}}}});
  }
  const container=document.getElementById('breakdown-list');
  container.innerHTML='';
  [...CATEGORY_DEFS].sort((a,b)=>(catTotals[b.id]||0)-(catTotals[a.id]||0)).forEach(cat=>{
    const amt=catTotals[cat.id]||0;const pct=spent>0?(amt/spent*100):0;
    const div=document.createElement('div');div.className='bd-row';
    div.innerHTML=`<span class="bd-name">${cat.icon} ${cat.label.split(' ')[0]}</span><div class="bd-bar-bg"><div class="bd-bar" style="width:${pct}%;background:${cat.color}"></div></div><span class="bd-amt" style="color:${cat.color}">${fmtS(amt)}</span>`;
    container.appendChild(div);
  });
}

// HISTORY
function renderHistory(){
  const container=document.getElementById('history-list');
  const months=Object.keys(state).sort((a,b)=>b.localeCompare(a)).slice(0,8);
  if(!months.length){container.innerHTML='<p class="empty-state">Save months to build history.</p>';return;}
  container.innerHTML='';
  months.forEach(key=>{
    const d=state[key];if(!d)return;
    const total=(d.income||0)+(d.otherIncome||0);
    const spent=(d.categories||[]).reduce((s,cat)=>s+cat.items.reduce((ss,it)=>ss+it.qty*it.cost,0),0);
    const rem=total-spent;
    const div=document.createElement('div');div.className='hist-row';
    div.onclick=()=>{document.getElementById('month-select').value=key;switchMonth(key);switchPage('categories');};
    div.innerHTML=`<span class="hist-month">${monthLabel(key)}</span><div class="hist-meta"><div class="hist-spent">${fmt(spent)}</div><div class="hist-bal" style="color:${rem>=0?'var(--green)':'var(--red)'}">${rem>=0?'+':''}${fmt(rem)}</div></div>`;
    container.appendChild(div);
  });
}

// SAVE
function captureState(){
  const d=getMonthData(currentMonth);
  d.income=parseFloat(document.getElementById('income-input')?.value)||0;
  d.otherIncome=parseFloat(document.getElementById('other-income')?.value)||0;
  d.savingsGoal=parseFloat(document.getElementById('goal-input')?.value)||0;
  d.notes=document.getElementById('notes-area')?.value||'';
}
function saveData(){captureState();saveState();toast('Saved ✓');renderHistory();}

// EXPORT
function exportCSV(){
  captureState();const d=getMonthData(currentMonth);
  let csv=`Household Budget — ${monthLabel(currentMonth)}\n\nTotal Income,${(d.income||0)+(d.otherIncome||0)}\n\n`;
  CATEGORY_DEFS.forEach(cat=>{
    const cd=d.categories.find(c=>c.id===cat.id);
    csv+=`${cat.label}\n`+(cat.hasQty?'Item,Qty,Unit Cost,Total\n':'Item,Cost\n');
    cd?.items.forEach(it=>{csv+=cat.hasQty?`${it.name},${it.qty},${it.cost},${it.qty*it.cost}\n`:`${it.name},${it.cost}\n`;});
    csv+=`Subtotal,,,${cd?.items.reduce((s,it)=>s+it.qty*it.cost,0)||0}\n\n`;
  });
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`budget-${currentMonth}.csv`;a.click();
}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000);}

function renderAll(){
  const d=getMonthData(currentMonth);
  document.getElementById('income-input').value=d.income??170000;
  document.getElementById('other-income').value=d.otherIncome??0;
  document.getElementById('goal-input').value=d.savingsGoal??30000;
  document.getElementById('notes-area').value=d.notes??'';
  renderCategories();recalculate();renderHistory();buildMonthOptions();
}

setInterval(()=>{captureState();saveState();},30000);
loadState();buildMonthOptions();renderAll();
</script>
</body>
